services:
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    user: 0:0
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./data:/data
      - ./logs:/var/log/rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data